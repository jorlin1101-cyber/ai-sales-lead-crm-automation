[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sales-lead-crm-automation"
version = "0.3.0"
description = "AI sales lead cleaning, scoring, and retrieval service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "email-validator",
    "openai",
    "httpx",
    "pyyaml",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.15.22",
    "mypy",
    "types-PyYAML",
    "pytest-socket",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lead_cleaner = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--basetemp=.pytest_tmp",
    "--cov=lead_cleaner",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
    "--disable-socket",
    "--allow-unix-socket",
    "--allow-hosts=127.0.0.1,::1",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "postgres: integration tests that require TEST_POSTGRES_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
warn_unused_configs = true
