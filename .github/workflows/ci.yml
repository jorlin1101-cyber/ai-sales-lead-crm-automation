name: offline-quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_MODE: demo
      ALLOW_NETWORK: "false"
      RAG_BACKEND: keyword_rrf
      RAG_REQUIRED: "true"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
      DEEPSEEK_API_KEY: ""
      DEEPSEEK_MODEL: ""
      NOTION_API_KEY: ""
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src

      - name: Pytest without external sockets
        run: python -m pytest -q

      - name: Offline demo smoke
        run: python scripts/ci_offline_smoke.py
