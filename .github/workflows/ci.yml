name: offline-quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_MODE: demo
      ALLOW_NETWORK: "false"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
      DEEPSEEK_API_KEY: ""
      DEEPSEEK_MODEL: ""
      NOTION_API_KEY: ""
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src

      - name: Pytest without external sockets
        run: python -m pytest -q

      - name: Offline demo smoke
        env:
          RAG_BACKEND: keyword_rrf
          RAG_REQUIRED: "true"
        run: python scripts/ci_offline_smoke.py


  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag ai-sales-lead-crm-automation:ci .

      - name: Run Docker smoke test
        run: |
          docker run --detach \
            --name ai-sales-lead-crm-automation-ci \
            --publish 127.0.0.1:18000:8000 \
            --env APP_MODE=demo \
            --env ALLOW_NETWORK=false \
            ai-sales-lead-crm-automation:ci

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health > /dev/null; then
              docker exec ai-sales-lead-crm-automation-ci \
                sh -c 'test "$(id -u)" -ne 0'
              exit 0
            fi

            sleep 1
          done

          docker logs ai-sales-lead-crm-automation-ci
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force ai-sales-lead-crm-automation-ci || true
