name: offline-quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadflow_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: leadflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadflow_test -d leadflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://leadflow_test:ci_test_only@127.0.0.1:5432/leadflow_test
      CONVERSATION_DATABASE_URL: postgresql+psycopg://leadflow_test:ci_test_only@127.0.0.1:5432/leadflow_test
      CONVERSATION_AUTO_CREATE_SCHEMA: "false"
      ALLOW_NETWORK: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.0"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python -m alembic upgrade head
      - run: uv run --no-sync python -m pytest tests/test_conversation_postgres.py -q -o addopts='' --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_MODE: demo
      ALLOW_NETWORK: "false"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
      DEEPSEEK_API_KEY: ""
      DEEPSEEK_MODEL: ""
      NOTION_API_KEY: ""
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify accepted scoring policy before evaluation
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          base_ref="${QUALITY_BASE_SHA:-$(git rev-parse refs/remotes/origin/main)}"
          if git cat-file -e "$base_ref:scripts/check_quality_policy.py" 2>/dev/null; then
            git show "$base_ref:scripts/check_quality_policy.py" > "$RUNNER_TEMP/accepted-quality-policy.py"
            python "$RUNNER_TEMP/accepted-quality-policy.py" --root . --trusted-ref "$base_ref"
          else
            python scripts/check_quality_policy.py --root . --trusted-ref "$base_ref" --bootstrap
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Install locked uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.0"
          cache-dependency-glob: "uv.lock"

      - name: Install project and development dependencies
        run: uv sync --locked --extra dev

      - name: Check container constraints against lock
        run: uv run --no-sync python scripts/check_quality_dependencies.py

      - name: Ruff lint
        run: uv run --no-sync python -m ruff check .

      - name: Ruff format check
        run: uv run --no-sync python -m ruff format --check .

      - name: Mypy
        run: uv run --no-sync python -m mypy src

      - name: Pytest without external sockets
        run: uv run --no-sync python -m pytest -q

      - name: Offline demo smoke
        env:
          RAG_BACKEND: keyword_rrf
          RAG_REQUIRED: "true"
        run: uv run --no-sync python scripts/ci_offline_smoke.py

      - name: Run both offline quality modes
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --no-sync python scripts/ci_quality_eval.py

      - name: Archive quality evidence even on failure
        id: quality-artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p0-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/runtime/ci-quality/
          if-no-files-found: warn
          retention-days: 30

      - name: Write artifact provenance outside sealed reports
        if: always() && steps.quality-artifact.outputs.artifact-id != ''
        env:
          QUALITY_ARTIFACT_ID: ${{ steps.quality-artifact.outputs.artifact-id }}
          QUALITY_ARTIFACT_DIGEST: ${{ steps.quality-artifact.outputs.artifact-digest }}
        run: uv run --no-sync python scripts/write_quality_provenance.py --root data/runtime/ci-quality --out data/runtime/quality-provenance/index.json

      - name: Archive outer provenance index
        if: always() && steps.quality-artifact.outputs.artifact-id != ''
        uses: actions/upload-artifact@v7
        with:
          name: p0-quality-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/runtime/quality-provenance/index.json
          if-no-files-found: error


  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag ai-sales-lead-crm-automation:ci .

      - name: Run Docker smoke test
        run: |
          docker run --detach \
            --name ai-sales-lead-crm-automation-ci \
            --publish 127.0.0.1:18000:8000 \
            --env APP_MODE=demo \
            --env ALLOW_NETWORK=false \
            ai-sales-lead-crm-automation:ci

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health > /dev/null; then
              docker exec ai-sales-lead-crm-automation-ci \
                sh -c 'test "$(id -u)" -ne 0'
              exit 0
            fi

            sleep 1
          done

          docker logs ai-sales-lead-crm-automation-ci
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force ai-sales-lead-crm-automation-ci || true
