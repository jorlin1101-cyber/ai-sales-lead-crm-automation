name: ai-sales-lead-crm-automation

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-sales-lead-crm-automation:local

    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped
    init: true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadflow
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - leadflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  leadflow-postgres-data:
